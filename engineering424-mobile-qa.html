<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KR90 · 手机布局检查</title><style>body{margin:0;padding:18px;background:#d6e0e5;color:#243b48;font:13px system-ui;text-align:center}h1{font-size:18px}p{max-width:700px;margin:8px auto 12px}label{display:inline-flex;gap:10px;align-items:center;margin-bottom:14px}select{height:44px;font:inherit;border:1px solid #78909b;border-radius:5px;padding:0 12px;background:white}iframe{display:block;width:360px;height:800px;border:0;margin:auto;background:white;box-shadow:0 4px 24px #3455}a{color:#126782}</style><h1>手机响应式检查</h1><p>真实页面的 CSS 视口检查，不代表 Android 触屏硬件验收。<a href="index.html">返回回放</a></p><label>视口尺寸<select id="size"><option value="320,640">320 × 640</option><option value="360,800" selected>360 × 800</option><option value="390,844">390 × 844</option><option value="430,932">430 × 932</option><option value="800,360">800 × 360 横屏</option></select></label><iframe src="index.html" title="手机尺寸回放页面"></iframe><script>document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',').map(Number),frame=document.querySelector('iframe');frame.style.width=w+'px';frame.style.height=h+'px';};</script></html>
